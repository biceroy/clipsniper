[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsniper"
version = "0.3.0"
description = "Find the big slot wins and hype moments in a Kick VOD, review them, cut the clips you want."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "httpx2", "numpy>=1.24", "pydantic>=2"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/biceroy/clipsniper"

[project.scripts]
clipsniper = "clipsniper:main"

[tool.setuptools]
packages = ["clipsniper"]

[tool.setuptools.package-data]
clipsniper = ["app.html", "hls.min.js"]
